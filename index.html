<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2d6a6a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="道德经">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>道德经研读</title>
<style>
/* ============ 设计令牌（东方书斋 · 石青主色） ============ */
:root{
  --paper:#f6f1e7; --paper-deep:#eee5d2; --card:#fbf7ee;
  --ink:#2b2723; --ink-soft:#6f6457; --line:#ddd2bc;
  --teal:#2d6a6a; --teal-deep:#245452;
  --clay:#8a7b63; --clay-deep:#6f6250; --gold:#b8893a;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --shadow:0 1px 3px rgba(43,39,35,.12),0 4px 14px rgba(43,39,35,.08);
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input{font-family:inherit;}

/* ============ 顶栏 ============ */
header{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:10px;
  padding:10px max(14px,env(safe-area-inset-left)) 10px max(14px,env(safe-area-inset-right));
  background:rgba(246,241,231,.92); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px;min-width:0;cursor:pointer;}
.brand-seal{
  flex:0 0 auto;width:32px;height:32px;border-radius:7px;
  background:var(--teal);color:#f6f1e7;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:18px;font-weight:700;
}
.brand-title{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:2px;white-space:nowrap;}
.brand-sub{display:block;font-family:var(--sans);font-size:10px;color:var(--ink-soft);font-weight:400;letter-spacing:1px;}
.spacer{flex:1;}
.top-btn{
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:999px;padding:7px 12px;font-size:13px;transition:all .15s;
}
.top-btn:active{transform:scale(.96);}
.top-btn.primary{border-color:var(--teal);background:var(--teal);color:#f6f1e7;}
.search-wrap{position:relative;flex:0 1 220px;min-width:120px;}
.search-wrap input{
  width:100%;padding:8px 12px 8px 30px;border:1px solid var(--line);border-radius:999px;
  background:var(--card);font-size:13px;color:var(--ink);
}
.search-wrap .icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:13px;pointer-events:none;}

/* ============ 布局 ============ */
#layout{display:flex;align-items:stretch;min-height:calc(100vh - 53px);}
#sidebar{
  width:264px;flex:0 0 264px;border-right:1px solid var(--line);
  padding:16px 12px;overflow-y:auto;max-height:calc(100vh - 53px);
  position:sticky;top:53px;
}
#main{flex:1;min-width:0;padding:28px max(20px,env(safe-area-inset-right)) 80px;max-width:900px;margin:0 auto;}

/* 侧栏 */
.side-title{font-size:11px;color:var(--ink-soft);letter-spacing:2px;margin:10px 8px 6px;font-weight:600;}
.side-ch{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:7px 10px;border-radius:9px;font-size:14px;transition:background .12s;}
.side-ch:hover{background:var(--paper-deep);}
.side-ch.active{background:var(--teal);color:#f6f1e7;}
.side-ch .no{font-family:var(--serif);font-size:12px;opacity:.75;min-width:16px;}
.side-ch .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.side-ch .dot{margin-left:auto;font-size:11px;opacity:.8;}
.side-ch .soon{color:var(--ink-soft);opacity:.6;}
.side-tags{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px;}
.tag-chip{border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:4px 10px;font-size:12px;transition:all .15s;}
.tag-chip.on{background:var(--gold);border-color:var(--gold);color:#fff;}
.tag-chip[data-active="1"]{background:var(--teal);border-color:var(--teal);color:#f6f1e7;}

/* ============ 视图 ============ */
.view{display:none;}
.view.show{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* 首页卷首 */
.intro{border:1px solid var(--line);border-radius:var(--r);padding:26px 28px;
  background:linear-gradient(180deg,var(--card),var(--paper-deep));margin-bottom:22px;position:relative;overflow:hidden;}
.intro::after{content:"道";position:absolute;right:18px;top:-12px;font-family:var(--serif);
  font-size:110px;opacity:.06;line-height:1;}
.intro h1{font-family:var(--serif);font-size:30px;letter-spacing:6px;font-weight:700;}
.intro .sub{color:var(--ink-soft);font-size:13px;margin-top:6px;letter-spacing:1px;}
.intro .stats{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap;}
.stat{text-align:center;}
.stat b{display:block;font-family:var(--serif);font-size:22px;color:var(--teal);}
.stat span{font-size:11px;color:var(--ink-soft);}

.sec-title{font-size:12px;color:var(--ink-soft);letter-spacing:2px;margin:18px 2px 10px;font-weight:600;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
.ch-card{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;
  text-align:left;transition:all .15s;position:relative;}
.ch-card:not(.soon):hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:var(--shadow);}
.ch-card.soon{opacity:.45;cursor:default;}
.ch-card .no{font-family:var(--serif);font-size:12px;color:var(--clay);letter-spacing:1px;}
.ch-card .nm{font-family:var(--serif);font-size:17px;font-weight:700;margin-top:3px;}
.ch-card .st{font-size:11px;color:var(--ink-soft);margin-top:3px;}
.ch-card .ck{position:absolute;top:10px;right:10px;color:var(--gold);font-size:13px;}

/* 阅读页 */
.read-head{border-bottom:2px solid var(--teal);padding-bottom:12px;margin-bottom:18px;}
.read-head .no{font-size:12px;color:var(--clay);letter-spacing:2px;}
.read-head h2{font-family:var(--serif);font-size:30px;letter-spacing:4px;margin-top:4px;}
.read-head .sub{color:var(--ink-soft);font-size:12px;margin-top:4px;}
.sec-label{font-size:12px;color:var(--teal);letter-spacing:3px;margin:22px 0 8px;font-weight:600;
  display:flex;align-items:center;gap:8px;}
.sec-label::after{content:"";flex:1;height:1px;background:var(--line);}
.paper-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;}
.origin-text{font-family:var(--serif);font-size:19px;line-height:2.15;letter-spacing:1px;color:var(--ink);white-space:pre-line;}
.origin-text .seal{color:var(--gold);}

/* 释义折叠 */
.line-item{border-bottom:1px dashed var(--line);padding:10px 0;}
.line-item:last-child{border-bottom:none;}
.line-q{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-family:var(--serif);font-size:15.5px;}
.line-q .mark{color:var(--gold);flex:0 0 auto;transition:transform .2s;}
.line-item.open .mark{transform:rotate(90deg);}
.line-a{display:none;margin-top:8px;font-size:14.5px;color:#444;line-height:1.85;padding-left:22px;}
.line-item.open .line-a{display:block;}
.line-src{display:inline-block;font-size:11px;color:var(--clay);margin-top:6px;font-family:var(--sans);}

/* 案例 */
.case{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:10px;background:var(--paper);}
.case .case-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.case .case-title{font-family:var(--serif);font-size:16px;font-weight:700;}
.case .tag{font-size:10px;border:1px solid var(--teal);color:var(--teal);border-radius:4px;padding:1px 6px;}
.case .ref{font-size:11px;color:var(--clay);}
.case .anec{font-size:14px;color:#3c3733;line-height:1.9;}
.case .anec b{color:var(--teal-deep);font-weight:600;}
.case .ins{font-size:13.5px;color:var(--ink-soft);margin-top:6px;line-height:1.8;border-top:1px dotted var(--line);padding-top:6px;}
.case .ins b{color:var(--teal);font-weight:600;}

/* 要旨 */
.essence-text{font-size:15px;line-height:2;font-family:var(--sans);}
.essence-text b{font-family:var(--serif);color:var(--teal-deep);}

/* 心得 */
.notes-area{position:relative;}
.notes-area textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);padding:14px 16px;font-size:14px;line-height:1.8;resize:vertical;color:var(--ink);}
.notes-area textarea:focus{outline:none;border-color:var(--teal);}
.notes-status{font-size:11px;color:var(--ink-soft);position:absolute;right:12px;bottom:-18px;}

/* 翻页 */
.pager{display:flex;gap:10px;margin-top:26px;}
.pager button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;
  padding:12px;text-align:center;font-size:13px;transition:all .15s;}
.pager button:hover{border-color:var(--teal);color:var(--teal);}
.pager button:disabled{opacity:.4;cursor:default;}

/* 搜索/标签结果 */
.hit{display:block;border:1px solid var(--line);background:var(--card);border-radius:10px;
  padding:12px 14px;margin-bottom:8px;text-align:left;width:100%;transition:all .12s;}
.hit:hover{border-color:var(--teal);}
.hit .h{font-size:13px;color:var(--ink-soft);margin-bottom:4px;}
.hit .h b{color:var(--teal);font-family:var(--serif);}
.hit .s{font-size:13.5px;color:#3c3733;line-height:1.7;}
.hit .s mark{background:rgba(184,137,58,.25);padding:0 2px;border-radius:2px;}

/* 抽屉（移动端） */
#mask{position:fixed;inset:0;background:rgba(43,39,35,.4);z-index:60;display:none;}
#mask.show{display:block;}
#drawer{position:fixed;left:0;top:0;bottom:0;width:78vw;max-width:300px;background:var(--paper);
  z-index:70;transform:translateX(-100%);transition:transform .25s ease;overflow-y:auto;padding:16px 12px;}
#drawer.show{transform:none;box-shadow:4px 0 20px rgba(43,39,35,.15);}
#drawer .brand{margin-bottom:8px;}
#drawerBtn{display:none;}

/* 空态 */
.empty{color:var(--ink-soft);text-align:center;padding:40px 0;font-size:14px;}

/* 响应式 */
@media (max-width:820px){
  #sidebar{display:none;}
  #drawerBtn{display:inline-flex;}
  #main{padding:18px 16px 90px;}
  .origin-text{font-size:17px;}
  /* 移动端：header 两行 —— 第一行 目录+应用名+循序，第二行 搜索整宽 */
  header{flex-wrap:wrap;gap:8px;padding:8px max(12px,env(safe-area-inset-left)) 10px max(12px,env(safe-area-inset-right));}
  .brand-title{font-size:16px;letter-spacing:1px;}
  .brand-sub{display:none;}
  .search-wrap{flex:1 1 100%;order:5;min-width:0;margin-top:2px;}
  .search-wrap input{padding:8px 12px 8px 30px;}
}
</style>
</head>
<body>

<header>
  <button id="drawerBtn" class="top-btn" aria-label="目录">☰ 目录</button>
  <div class="brand" id="brandBtn">
    <div class="brand-seal">道</div>
    <div>
      <div class="brand-title">道德经研读</div>
      <div class="brand-sub">老子 · 五千年书斋</div>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="search-wrap">
    <span class="icon">🔍</span>
    <input id="searchInput" type="search" placeholder="检索原文/释义/案例/心得" autocomplete="off">
  </div>
  <button class="top-btn" id="todayBtn" title="循序：打开顺序上第一个未读章节，逐章推进研读进度">循序</button>
</header>

<div id="mask"></div>
<aside id="drawer"></aside>

<div id="layout">
  <aside id="sidebar"></aside>
  <main id="main">
    <section id="view-home" class="view show">
      <div class="intro">
        <h1>道 德 经</h1>
        <div class="sub">原文 · 释义 · 现实案例 · 心得 · 老子五千年</div>
        <div class="stats">
          <div class="stat"><b id="st-read">0</b><span>已读</span></div>
          <div class="stat"><b>9</b><span>已收录</span></div>
          <div class="stat"><b>81</b><span>全经</span></div>
          <div class="stat"><b id="st-note">0</b><span>心得</span></div>
        </div>
      </div>
      <div class="sec-title">上篇 · 道经（前9章已收录，余章待续）</div>
      <div class="grid" id="chapterGrid"></div>
    </section>

    <section id="view-reader" class="view"></section>

    <section id="view-search" class="view"></section>

    <section id="view-tags" class="view"></section>
  </main>
</div>

<script src="data.js"></script>
<script>
(function(){
'use strict';
var D = window.APP_DATA || { chapters: [] };
var chapters = D.chapters;

/* ---------- 状态 ---------- */
var NOTES_KEY = 'ddj_notes_v1';
var READ_KEY  = 'ddj_read_v1';
var TAG_KEY   = 'ddj_tag_v1';
var TAGS = ['管理','职场','生活','修养','心理','人际','治理','领导力'];

function load(k, def){ try{ var v=JSON.parse(localStorage.getItem(k)); return v==null?def:v; }catch(e){ return def; } }
function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

var notes = load(NOTES_KEY, {});   // {num: text}
var read  = load(READ_KEY,  {});   // {num: true}

function saveNotes(){ save(NOTES_KEY, notes); }
function saveRead(){ save(READ_KEY, read); }

/* ---------- 工具 ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function byId(id){ return document.getElementById(id); }
function show(view){ ['home','reader','search','tags'].forEach(function(v){ byId('view-'+v).classList.toggle('show', v===view); }); if(view!=='reader') window.scrollTo(0,0); }

function todayChapter(){
  // 循序：打开顺序上第一个未读章节，逐章推进研读进度；全部已读则回到第1章（新一轮）
  for (var i = 1; i <= chapters.length; i++) {
    if (!read[i]) return i;
  }
  return 1;
}

/* ---------- 渲染：侧栏 ---------- */
function renderSidebar(root){
  var h = '<div class="side-title">章 目</div>';
  chapters.forEach(function(c){
    var r = !!read[c.num];
    var d = c.num===chapters.length ? '' : '';
    h += '<button class="side-ch'+(cur===c.num?' active':'')+'" data-num="'+c.num+'">'
       + '<span class="no">'+c.num+'</span><span class="nm">'+esc(c.title)+'</span>'
       + (r?'<span class="dot">☑</span>':'') + '</button>';
  });
  h += '<div class="side-title">案例方向</div><div class="side-tags">';
  TAGS.forEach(function(t){
    h += '<button class="tag-chip'+(activeTag===t?'':'')+'" data-active="'+(activeTag===t?'1':'0')+'" data-tag="'+t+'">'+t+'</button>';
  });
  h += '</div>';
  h += '<div class="side-title">心得</div>';
  h += '<button class="side-ch" id="exportBtn">⬇ 导出心得</button>';
  h += '<button class="side-ch" id="importBtn">⬆ 导入心得</button>';
  root.innerHTML = h;
  bindSidebar(root);
}

function bindSidebar(root){
  root.querySelectorAll('.side-ch[data-num]').forEach(function(b){ b.addEventListener('click', function(){ openChapter(+b.dataset.num); }); });
  root.querySelectorAll('.tag-chip').forEach(function(b){ b.addEventListener('click', function(){ toggleTag(b.dataset.tag); }); });
  root.querySelector('#exportBtn').addEventListener('click', exportNotes);
  root.querySelector('#importBtn').addEventListener('click', importClick);
}

/* ---------- 渲染：首页 ---------- */
function renderHome(){
  byId('st-read').textContent = chapters.filter(function(c){ return read[c.num]; }).length;
  byId('st-note').textContent = Object.keys(notes).filter(function(k){ return notes[k] && notes[k].trim(); }).length;
  var g = byId('chapterGrid');
  var h = '';
  for(var i=1;i<=81;i++){
    var c = chapters.find(function(x){ return x.num===i; });
    if(c){
      var r = !!read[c.num];
      h += '<button class="ch-card" data-num="'+c.num+'">'
         + '<div class="no">第'+c.num+'章</div><div class="nm">'+esc(c.title)+'</div>'
         + '<div class="st">'+c.lines.length+' 句 · '+c.cases.length+' 例</div>'
         + (r?'<div class="ck">☑</div>':'') + '</button>';
    } else {
      h += '<div class="ch-card soon"><div class="no">第'+i+'章</div><div class="nm">待续</div></div>';
    }
  }
  g.innerHTML = h;
  g.querySelectorAll('.ch-card[data-num]').forEach(function(b){ b.addEventListener('click', function(){ openChapter(+b.dataset.num); }); });
}

/* ---------- 渲染：阅读页 ---------- */
function openChapter(num){
  var c = chapters.find(function(x){ return x.num===num; });
  if(!c) return;
  cur = num; activeTag = null;
  byId('view-reader').innerHTML = readerHTML(c);
  byId('view-reader').querySelectorAll('.line-q').forEach(function(b){
    b.addEventListener('click', function(){ b.parentElement.classList.toggle('open'); });
  });
  var ta = byId('noteInput');
  if(ta){
    ta.value = notes[num] || '';
    var t; ta.addEventListener('input', function(){
      clearTimeout(t); t = setTimeout(function(){
        notes[num] = ta.value; saveNotes(); setNoteStatus('已保存');
      }, 500);
    });
  }
  byId('readDone').addEventListener('click', function(){
    read[num] = !read[num]; saveRead();
    byId('readDone').textContent = read[num] ? '☑ 已读' : '○ 标记已读';
    renderSidebar(byId('sidebar')); renderDrawer();
  });
  var prev = byId('prevBtn'), next = byId('nextBtn');
  if(prev) prev.addEventListener('click', function(){ openChapter(num-1); });
  if(next) next.addEventListener('click', function(){ openChapter(num+1); });
  // 底部翻页按钮（若有独立）
  var pn = byId('pagerNext'); if(pn) pn.addEventListener('click', function(){ openChapter(num+1); });
  var pp = byId('pagerPrev'); if(pp) pp.addEventListener('click', function(){ openChapter(num-1); });
  show('reader');
  renderSidebar(byId('sidebar')); renderDrawer();
  window.scrollTo(0,0);
}

function readerHTML(c){
  var lines = c.lines.map(function(l,i){
    return '<div class="line-item'+(i<1?' open':'')+'">'
      + '<div class="line-q"><span class="mark">▸</span><span>'+esc(l.q)+'</span></div>'
      + '<div class="line-a">'+esc(l.a)+(l.source?'<div class="line-src">— '+esc(l.source)+'</div>':'')+'</div>'
      + '</div>';
  }).join('');

  var cases = c.cases.map(function(k){
    var tags = k.tag.map(function(t){ return '<span class="tag">'+esc(t)+'</span>'; }).join('');
    var lab = k.anecdote.indexOf('论述')>-1 ? '论述' : '典故';
    return '<div class="case">'
      + '<div class="case-head"><span class="case-title">'+esc(k.title)+'</span>'+tags+'<span class="ref">'+esc(k.ref)+'</span></div>'
      + '<div class="anec"><b>'+lab+'：</b>'+esc(k.anecdote)+'</div>'
      + '<div class="ins"><b>今鉴：</b>'+esc(k.insight)+'</div>'
      + '</div>';
  }).join('');

  var essence = c.essence.replace(/\n/g,'<br>');

  return '<div class="read-head">'
    + '<div class="no">第 '+c.num+' 章 · 上篇道经</div>'
    + '<h2>'+esc(c.title)+'</h2>'
    + '<div class="sub">'+c.lines.length+' 句释义 · '+c.cases.length+' 个案例</div>'
    + '</div>'
    + '<div class="sec-label">原 文</div>'
    + '<div class="paper-card"><div class="origin-text">'+esc(c.text)+'</div></div>'
    + '<div class="sec-label">逐句释义</div>'
    + '<div class="paper-card">'+lines+'</div>'
    + '<div class="sec-label">现实案例</div>'
    + cases
    + '<div class="sec-label">本章要旨</div>'
    + '<div class="paper-card essence-text">'+essence+'</div>'
    + '<div class="sec-label">心得笔记</div>'
    + '<div class="paper-card notes-area">'
    + '<textarea id="noteInput" placeholder="记录你对本章的感悟……"></textarea>'
    + '<span class="notes-status" id="noteStatus"></span>'
    + '</div>'
    + '<div class="pager">'
    + '<button id="prevBtn"'+(c.num<=1?' disabled':'')+'>← 上一章</button>'
    + '<button id="readDone">'+ (read[c.num]?'☑ 已读':'○ 标记已读') +'</button>'
    + '<button id="nextBtn"'+(c.num>=chapters.length?' disabled':'')+'>下一章 →</button>'
    + '</div>';
}

function setNoteStatus(msg){ var s=byId('noteStatus'); if(!s)return; s.textContent=msg; setTimeout(function(){ s.textContent=''; },1500); }

/* ---------- 案例标签 ---------- */
var activeTag = null;
function toggleTag(t){
  if(activeTag === t){ activeTag = null; renderSidebar(byId('sidebar')); renderDrawer(); return; }
  activeTag = t; renderSidebar(byId('sidebar')); renderDrawer(); renderTagView();
}
function renderTagView(){
  var t = activeTag; if(!t) return;
  var hits = [];
  chapters.forEach(function(c){
    c.cases.forEach(function(k){
      if(k.tag.indexOf(t)>-1) hits.push({ num:c.num, title:c.title, k:k });
    });
  });
  var h = '<div class="read-head"><div class="no">案例方向</div><h2>'+t+'</h2>'
    + '<div class="sub">'+hits.length+' 个案例 · 跨章浏览</div></div>';
  if(!hits.length) h += '<div class="empty">该方向暂无案例</div>';
  hits.forEach(function(it){
    var lab = it.k.anecdote.indexOf('论述')>-1 ? '论述' : '典故';
    h += '<button class="hit" data-num="'+it.num+'">'
      + '<div class="h">第'+it.num+'章 · '+esc(it.title)+' · '+esc(it.k.title)+'</div>'
      + '<div class="s">'+esc(it.k.insight)+'</div></button>';
  });
  byId('view-tags').innerHTML = h;
  byId('view-tags').querySelectorAll('.hit').forEach(function(b){ b.addEventListener('click', function(){ openChapter(+b.dataset.num); }); });
  show('tags');
}

/* ---------- 检索 ---------- */
var lastQuery = '';
function doSearch(q){
  q = (q||'').trim().toLowerCase();
  if(!q){ show('home'); return; }
  lastQuery = q;
  var hits = [];
  function push(num, kind, head, snippet){
    var idx = snippet.toLowerCase().indexOf(q);
    if(idx<0) return;
    var s = snippet; var m = function(x){ return x; };
    hits.push({ num:num, kind:kind, head:head, snippet:s, idx:idx });
  }
  chapters.forEach(function(c){
    if(c.text.toLowerCase().indexOf(q)>-1) push(c.num,'原文','第'+c.num+'章 · '+c.title, c.text);
    c.lines.forEach(function(l){
      if(l.q.toLowerCase().indexOf(q)>-1 || l.a.toLowerCase().indexOf(q)>-1)
        push(c.num,'释义','第'+c.num+'章 · '+esc(l.q), l.q+'：'+l.a);
    });
    c.cases.forEach(function(k){
      if(k.title.toLowerCase().indexOf(q)>-1 || k.anecdote.toLowerCase().indexOf(q)>-1 || k.insight.toLowerCase().indexOf(q)>-1)
        push(c.num,'案例','第'+c.num+'章 · '+k.title, k.anecdote+' '+k.insight);
    });
    if(c.essence.toLowerCase().indexOf(q)>-1) push(c.num,'要旨','第'+c.num+'章要旨', c.essence);
  });
  // 心得
  Object.keys(notes).forEach(function(n){
    var txt = notes[n]; if(!txt) return;
    if(txt.toLowerCase().indexOf(q)>-1) push(+n,'心得','第'+n+'章 · 我的心得', txt);
  });
  hits = hits.slice(0,50);
  var h = '<div class="read-head"><div class="no">检索</div><h2>"'+esc(q)+'"</h2>'
    + '<div class="sub">'+hits.length+' 处命中</div></div>';
  if(!hits.length) h += '<div class="empty">未检索到相关内容</div>';
  hits.forEach(function(it){
    var i = it.snippet.toLowerCase().indexOf(q);
    var before = it.snippet.slice(Math.max(0,i-20), i);
    var after = it.snippet.slice(i+q.length, i+q.length+60);
    var match = it.snippet.slice(i, i+q.length);
    var s = esc(before) + '<mark>'+esc(match)+'</mark>' + esc(after);
    h += '<button class="hit" data-num="'+it.num+'">'
      + '<div class="h"><b>'+it.kind+'</b> · '+it.head+'</div><div class="s">'+s+'</div></button>';
  });
  byId('view-search').innerHTML = h;
  byId('view-search').querySelectorAll('.hit').forEach(function(b){ b.addEventListener('click', function(){ openChapter(+b.dataset.num); }); });
  show('search');
}

/* ---------- 导出/导入 ---------- */
function exportNotes(){
  var data = { notes:notes, read:read, exportedAt:new Date().toISOString() };
  var blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '道德经研读-心得备份.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
function importNotes(file){
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(r.result);
      if(!d || typeof d!=='object') throw 0;
      if(d.notes) Object.keys(d.notes).forEach(function(n){ notes[n]=d.notes[n]; });
      if(d.read) Object.keys(d.read).forEach(function(n){ read[n]=d.read[n]; });
      saveNotes(); saveRead();
      renderHome(); renderSidebar(byId('sidebar')); renderDrawer();
      alert('导入成功：'+Object.keys(d.notes||{}).length+' 条心得');
    }catch(e){ alert('导入失败：文件格式不正确'); }
  };
  r.readAsText(file);
}

/* ---------- 导入触发（sidebar 按钮共用） ---------- */
var importClick = function(){ imp && imp.click(); };

/* ---------- 抽屉（移动端） ---------- */
function renderDrawer(){
  var d = byId('drawer');
  d.innerHTML = '';
  var inner = document.createElement('div');
  inner.innerHTML = '<div class="brand"><div class="brand-seal">道</div>'
    + '<div><div class="brand-title">道德经研读</div><div class="brand-sub">章 目</div></div></div>';
  d.appendChild(inner);
  var list = document.createElement('div');
  list.innerHTML = chapterSideHTML();
  d.appendChild(list);
  d.querySelectorAll('[data-num]').forEach(function(b){ b.addEventListener('click', function(){ closeDrawer(); openChapter(+b.dataset.num); }); });
  d.querySelectorAll('.tag-chip').forEach(function(b){ b.addEventListener('click', function(){ closeDrawer(); toggleTag(b.dataset.tag); }); });
}
function chapterSideHTML(){
  var h = '';
  chapters.forEach(function(c){
    var r = !!read[c.num];
    h += '<button class="side-ch'+(cur===c.num?' active':'')+'" data-num="'+c.num+'">'
      + '<span class="no">'+c.num+'</span><span class="nm">'+esc(c.title)+'</span>'
      + (r?'<span class="dot">☑</span>':'') + '</button>';
  });
  h += '<div class="side-title">案例方向</div><div class="side-tags">';
  TAGS.forEach(function(t){
    h += '<button class="tag-chip" data-active="'+(activeTag===t?'1':'0')+'" data-tag="'+t+'">'+t+'</button>';
  });
  h += '</div>';
  return h;
}
function openDrawer(){ byId('drawer').classList.add('show'); byId('mask').classList.add('show'); }
function closeDrawer(){ byId('drawer').classList.remove('show'); byId('mask').classList.remove('show'); }

/* ---------- 全局事件 ---------- */
var cur = 1;
byId('brandBtn').addEventListener('click', function(){ renderHome(); renderSidebar(byId('sidebar')); renderDrawer(); show('home'); });
byId('todayBtn').addEventListener('click', function(){ openChapter(todayChapter()); });
byId('drawerBtn').addEventListener('click', openDrawer);
byId('mask').addEventListener('click', closeDrawer);
var deb; byId('searchInput').addEventListener('input', function(){ var v=this.value; clearTimeout(deb); deb=setTimeout(function(){ doSearch(v); },250); });
var imp = document.createElement('input'); imp.type='file'; imp.accept='.json,application/json';
imp.style.display='none'; document.body.appendChild(imp);
imp.addEventListener('change', function(){ if(imp.files[0]) importNotes(imp.files[0]); imp.value=''; });

/* ---------- 初始化 ---------- */
renderHome();
renderSidebar(byId('sidebar'));
renderDrawer();
})();
</script>
